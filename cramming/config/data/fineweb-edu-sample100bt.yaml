# FineWeb-Edu 100B-token sample for education-filtered encoder data.
#
# Use this as the larger educational/scientific comparison corpus after the
# 10B smoke, or as an upsample candidate when building a custom readymade mix.

name: fineweb-edu-sample100bt
defaults:
  - sources:
      - fineweb_edu_sample100bt

normalizer:
  force_lowercase: true
  strip_accents: true
  force_english_keyboard: true
  whitespace_escape: false

tokenizer: WordPiece
vocab_size: 32768

seq_length: 128
include_cls_token_in_corpus: false
include_sep_token_in_corpus: true
use_type_ids: false

max_entries_in_raw_dataset: 100e6
max_seq_in_tokenized_dataset: 1e14

named_entity_simplification: false
remove_whitespaces: false
remove_trash: true
trash_cutoff: 0.25
deduplicate_entries: false
deduplication_threshold: 75

ordering: sentence-length-curriculum
