# FineWeb sample for modern encoder recipe experiments.
#
# Requires tokenization/preprocessing time. Keep `pile-readymade` for immediate
# final runs unless this corpus has already been materialized.

name: fineweb-sample10bt
defaults:
  - sources:
      - fineweb_sample10bt

normalizer:
  force_lowercase: true
  strip_accents: true
  force_english_keyboard: true
  whitespace_escape: false

tokenizer: WordPiece
vocab_size: 32768

seq_length: 128
include_cls_token_in_corpus: false
include_sep_token_in_corpus: true
use_type_ids: false

max_entries_in_raw_dataset: 25e6
max_seq_in_tokenized_dataset: 85e6

named_entity_simplification: false
remove_whitespaces: false
remove_trash: true
trash_cutoff: 0.25
deduplicate_entries: false
deduplication_threshold: 75

ordering: sentence-length-curriculum
