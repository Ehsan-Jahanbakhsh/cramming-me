# Modernized RR pretraining recipe.
#
# ModernBERT-style WSD/trapezoid schedule: warm up, hold LR, then decay
# during cooldown while respecting the wallclock budget.

name: rr-modern-wsd

defaults:
  - optim: adam
  - optim_mod: disabled

limited_decay_keys: [bias, LayerNorm.bias, LayerNorm.weight, norm]

optim:
  type: AdamW
  lr: 6e-4
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.1
  amsgrad: false
  fused:

warmup_steps: 2_000
cooldown_steps: 100_000
steps: 2_500_000
scheduler: budget-wsd
lr_end_factor: 0.1

batch_size: 4096
batch_size_ramp: 0.1

gradient_clipping: 1.0
pretrain_in_train_mode: false

objective:
  name: masked-lm
  mlm_probability: 0.30
  use_80_20_rule: true
  disable_mlm: false
  token_drop: 0.0

reverse_dataset_order: false

budget: ${budget}
